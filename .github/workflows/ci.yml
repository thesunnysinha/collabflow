name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/backend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: CI=true npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          printf 'JWT_SECRET=%s\nMONGO_PASSWORD=%s\nGITHUB_CLIENT_ID=ci\nGITHUB_CLIENT_SECRET=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 8)" "$(openssl rand -hex 8)" > .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Build production images
        run: docker compose build
