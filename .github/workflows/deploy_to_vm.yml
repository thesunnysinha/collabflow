name: Deploy to VM

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  ci:
    uses: ./.github/workflows/quality.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    concurrency: deploy

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install vm-tool

    - name: Create SSH identity file
      env:
        SSH_ID_RSA: ${{ secrets.SSH_ID_RSA }}
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_ID_RSA" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: Deploy to VM
      env:
        GITHUB_SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        GITHUB_SSH_IDENTITY_FILE: ~/.ssh/id_rsa
        GITHUB_SSH_HOSTNAME: ${{ secrets.SSH_HOSTNAME }}
      run: |
        python scripts/deploy_to_vm.py

    - name: Clean up SSH identity file
      if: always()
      run: |
        rm ~/.ssh/id_rsa
