# Production stack. Only Caddy (80/443) is exposed to the host; every other service
# lives on the internal network. For local development use docker-compose.dev.yml.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-collabflow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?required}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    networks: [collaborativenetwork]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    logging: *logging
    networks: [collaborativenetwork]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Edits are persisted to MongoDB by the consumer; Kafka only needs a short buffer.
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    logging: *logging
    networks: [collaborativenetwork]

  backend:
    build:
      context: ./services/backend
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8000
      MONGO_URI: mongodb://${MONGO_USER:-collabflow}:${MONGO_PASSWORD}@mongo:27017/collabflow?authSource=admin
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?required}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?required}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?required}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN:-localhost}}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }
    logging: *logging
    networks: [collaborativenetwork]

  frontend:
    build:
      context: ./services/frontend
      target: production
    restart: unless-stopped
    logging: *logging
    networks: [collaborativenetwork]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, frontend]
    logging: *logging
    networks: [collaborativenetwork]

volumes:
  mongo_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  caddy_data:
  caddy_config:

networks:
  collaborativenetwork:
    name: collaborativenetwork
    driver: bridge
